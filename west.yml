manifest:
  remotes:
    - name: adi
      url-base: https://github.com/analogdevicesinc/

  projects:
    - name: zephyr
      remote: adi
      revision: main
      import:
        # By using name-allowlist we can clone only the modules that are
        # strictly needed by the application.
        name-allowlist:
          - cmsis      # required by the ARM port
          - hal_adi    # Analog Devices HAL
